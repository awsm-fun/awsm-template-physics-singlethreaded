# Build flags for the wasm target. Single-threaded, so these are the WHOLE story
# — there's no env RUSTFLAGS override (the Taskfile no longer sets one), so every
# build (trunk, `cargo check`, rust-analyzer) uses exactly what's here:
#   * the two cfgs the deps need (web-sys unstable APIs, getrandom's wasm backend),
#   * `+simd128` — wasm SIMD, matching box3d-sys's `-msimd128` C build and giving
#     glam/renderer code the vector path. Every WebGPU-capable browser has it.
[target.wasm32-unknown-unknown]
rustflags = [
    "--cfg=web_sys_unstable_apis",
    "--cfg=getrandom_backend=\"wasm_js\"",
    "-C",
    "target-feature=+simd128",
]

# awsm-renderer (0.21+) pulls in the `meshopt` crate, which compiles the official
# meshoptimizer C++ library via `cc`. Apple clang has no WebAssembly backend
# ("no available targets are compatible with triple wasm32-unknown-unknown"), so
# point cc at Homebrew LLVM for this target only. Requires `brew install llvm`.
#
# This is a macOS FALLBACK for builds that bypass the Taskfile (a bare
# `cargo check`, rust-analyzer). `task` (and therefore CI) exports resolved,
# PORTABLE CC/CXX/AR that OVERRIDE these — an exported env var wins over a config
# `[env]` value — so Linux/CI uses its stock wasm-capable clang and never sees
# this macOS path. See the `env:` block in Taskfile.yml. On a non-macOS machine
# without the Taskfile, override via the CC_wasm32-unknown-unknown / CXX_… / AR_…
# environment variables (or just build through `task`).
[env]
CC_wasm32-unknown-unknown = "/opt/homebrew/opt/llvm/bin/clang"
CXX_wasm32-unknown-unknown = "/opt/homebrew/opt/llvm/bin/clang++"
AR_wasm32-unknown-unknown = "/opt/homebrew/opt/llvm/bin/llvm-ar"

# Mirror the cfg on native targets so editor tooling doesn't error out.
[target.'cfg(not(target_arch = "wasm32"))']
rustflags = ["--cfg=web_sys_unstable_apis"]
